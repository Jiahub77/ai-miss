<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Two abstract cats with potato chip mouths</title>
  <desc id="desc">An abstract romantic cover illustration of two cats close together, each holding a potato chip in their mouth.</desc>
